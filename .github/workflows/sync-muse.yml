name: Sync Muse episodes

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: sync-muse
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy new episodes from Muse
        env:
          MUSE_FEED_URL: ${{ secrets.MUSE_FEED_URL }}
        run: python3 scripts/sync_muse.py

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No new episodes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio episodes.json
          git commit -m "Sync new Muse episodes"
          git push
